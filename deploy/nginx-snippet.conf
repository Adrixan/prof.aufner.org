# Prof. Aufner - nginx-Variante der .htaccess-Regeln.
# In den server { }-Block der Domain prof.aufner.org einbinden (falls der Host
# nginx-Konfiguration erlaubt). Hinweis: add_header in einem location-Block
# ersetzt die geerbten Header des server-Blocks, dort also alle erneut setzen.

server_tokens off;
autoindex off;

# www -> Apex (301). HTTPS-Redirect uebernimmt der Host bzw. ein eigener server-Block.
if ($host = www.prof.aufner.org) { return 301 https://prof.aufner.org$request_uri; }

error_page 403 404 /404.html;

# Dotfiles und Dot-Verzeichnisse sperren, .well-known bleibt erreichbar
location ~ /\.(?!well-known(/|$)) { return 404; }

# Interne und sensible Dateien
location ^~ /deploy/ { return 404; }
location ~* \.(md|bak|orig|old|swp|map|sql|log|ini|sh|ya?ml|lock)$ { return 404; }

# Security-Header
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# [TODO: HSTS-Preload entscheiden; Host sendet bereits max-age=15768000; includeSubDomains]
add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

# Caching
location ~* \.woff2$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
